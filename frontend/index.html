<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/langnote_48.png" />
    <link rel="apple-touch-icon" href="/assets/langnote_48.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LangNote — a warm, distraction-free notebook to capture, search, and organize your personal notes." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ece3ca" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LangNote" />
    <meta property="og:title" content="LangNote — Your Personal Notebook" />
    <meta property="og:description" content="A warm, distraction-free notebook to capture, search, and organize your personal notes." />
    <meta property="og:image" content="/assets/langnote.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LangNote — Your Personal Notebook" />
    <meta name="twitter:description" content="A warm, distraction-free notebook to capture, search, and organize your personal notes." />
    <meta name="twitter:image" content="/assets/langnote.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LangNote",
        "applicationCategory": "NoteTakingApplication",
        "operatingSystem": "All",
        "description": "A warm, distraction-free notebook to capture, search, and organize your personal notes.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      img-src 'self' data:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' http://localhost:5001 https://*.azurewebsites.net;
    ">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    />

    <!-- Apply saved theme before first paint to prevent a theme flash -->
    <script>
      (function () {
        try {
          var allowed = ["retro", "light", "dark"];
          var saved = localStorage.getItem("theme");
          var theme = allowed.indexOf(saved) !== -1 ? saved : "retro";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "retro");
        }
      })();
    </script>

    <title>LangNote — Your Personal Notebook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
